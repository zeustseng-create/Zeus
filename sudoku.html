function loadKillerTemplate(){killerPreverified=true;regions=standardRegions();givens=Array(N*N).fill(false);sol=[...(N===9?KILLER9_SOL:KILLER6_SOL)];let cages=(N===9?KILLER9_CAGES:KILLER6_CAGES).map(c=>({sum:c.sum,cells:[...c.cells]}));constraints={pairs:[],cages:[]};
 // More stars = fewer split cages = fewer local hints. Splitting never creates a singleton.
 let splitTarget=(N===9?[5,4,3,2,1,0]:[9,7,5,3,1,0])[difficulty-1],order=shuffle([...Array(cages.length).keys()]),splitSet=new Set();for(let ci of order){if(splitSet.size>=splitTarget)break;if(cages[ci].cells.length===4){let sp=splitFourCage(cages[ci]);if(sp)splitSet.add(ci)}}let next=[];for(let ci=0;ci<cages.length;ci++){if(splitSet.has(ci)){let sp=splitFourCage(cages[ci]);next.push(...sp)}else next.push(cages[ci])}cages=next;
 // Randomize presentation with only adjacency/box-preserving geometric transforms.
 let mode=Math.floor(Math.random()*(N===9?8:4)),newSol=Array(N*N);for(let i=0;i<N*N;i++)newSol[geomMap(i,mode)]=sol[i];cages=cages.map(c=>({sum:c.sum,cells:c.cells.map(i=>geomMap(i,mode))}));sol=newSol;
 // Complement 1↔N, 2↔N-1... is bijective; update each cage sum exactly.
 if(Math.random()<.5){sol=sol.map(v=>N+1-v);cages=cages.map(c=>({cells:c.cells,sum:c.cells.length*(N+1)-c.sum}))}
 constraints={pairs:[],cages};return true}
function tripleCandidates(){let out=[],seen=new Set();for(let a=0;a<N*N;a++)for(let b of neighbors(a))for(let c of [...neighbors(a),...neighbors(b)]){if(c===a||c===b)continue;let ar=[a,b,c].sort((x,y)=>x-y),key=ar.join(',');if(seen.has(key))continue;seen.add(key);let vs=new Set(ar.map(i=>sol[i]));if(vs.size===3)out.push(ar)}return shuffle(out)}
function pairMatching(excluded){let un=new Set([...Array(N*N).keys()].filter(i=>!excluded.has(i))),pairs=[];function rec(){if(!un.size)return true;let best=-1,cands=null;for(let x of un){let ns=neighbors(x).filter(y=>un.has(y));if(!cands||ns.length<cands.length){best=x;cands=ns;if(ns.length<=1)break}}if(!cands||!cands.length)return false;un.delete(best);for(let y of shuffle(cands)){if(!un.has(y))continue;un.delete(y);pairs.push([best,y]);if(rec())return true;pairs.pop();un.add(y)}un.add(best);return false}return rec()?pairs:null}
function baseKillerCages(){if(N%2===0){let p=pairMatching(new Set());return p?p.map(c=>({cells:c,sum:c.reduce((s,i)=>s+sol[i],0)})):null}for(let tri of tripleCandidates().slice(0,120)){let p=pairMatching(new Set(tri));if(p){let cages=[tri,...p];return cages.map(c=>({cells:c,sum:c.reduce((s,i)=>s+sol[i],0)}))}}return null}
function cagesAdjacent(a,b){let sb=new Set(b.cells);return a.cells.some(i=>neighbors(i).some(n=>sb.has(n)))}
function unionNoRepeat(a,b){let s=new Set();for(let i of [...a.cells,...b.cells]){if(s.has(sol[i]))return false;s.add(sol[i])}return true}
function buildKillerUnique(){givens=Array(N*N).fill(false);let base=null,ok=false;for(let t=0;t<45&&!ok;t++){base=baseKillerCages();if(!base)continue;constraints={pairs:[],cages:base};ok=solveStats(2).solutions===1}if(!ok)return false;
 let targets=N===9?[40,36,32,28,24,21]:[18,16,14,12,10,9],maxSizes=[3,3,4,4,5,5],target=targets[difficulty-1],maxSize=maxSizes[difficulty-1],tests=0;
 while(constraints.cages.length>target&&tests<180){let candidates=[];for(let i=0;i<constraints.cages.length;i++)for(let j=i+1;j<constraints.cages.length;j++){let A=constraints.cages[i],B=constraints.cages[j];if(A.cells.length+B.cells.length<=maxSize&&cagesAdjacent(A,B)&&unionNoRepeat(A,B))candidates.push([i,j])}if(!candidates.length)break;let merged=false;for(let [i,j] of shuffle(candidates).slice(0,30)){tests++;let old=constraints.cages,cell=[...old[i].cells,...old[j].cells],nc={cells:cell,sum:cell.reduce((s,x)=>s+sol[x],0)},trial=old.filter((_,k)=>k!==i&&k!==j);trial.push(nc);constraints={pairs:[],cages:trial};if(solveStats(2).solutions===1){merged=true;break}else constraints={pairs:[],cages:old};if(tests>=180)break}if(!merged)break}
 return true}
function validateSolution(){for(let r=0;r<N;r++){let sr=new Set(),sc=new Set();for(let c=0;c<N;c++){sr.add(sol[idx(r,c)]);sc.add(sol[idx(c,r)])}if(sr.size!==N||sc.size!==N)return false}for(let g=0;g<N;g++){let s=new Set();for(let i=0;i<N*N;i++)if(regions[i]===g)s.add(sol[i]);if(s.size!==N)return false}return true}
function validatePuzzle(){if(!validateSolution())return false;if(type==='killer'){if(givens.some(Boolean))return false;let seen=Array(N*N).fill(0);for(let cage of constraints.cages){let ds=new Set(),sum=0;if(cage.cells.length<2||!cellsConnected(cage.cells))return false;for(let i of cage.cells){seen[i]++;ds.add(sol[i]);sum+=sol[i]}if(ds.size!==cage.cells.length||sum!==cage.sum)return false}if(seen.some(x=>x!==1))return false;if(killerPreverified)return true}
 if(type==='sum'){for(let p of constraints.pairs)if(sol[p.a]+sol[p.b]!==p.v)return false;let ds=new Set(constraints.pairs.map(p=>p.v));if(constraints.pairs.length>=5&&ds.size<Math.min(4,constraints.pairs.length))return false}
 if(type==='jigsaw'){let std=standardRegions();if(regions.every((x,i)=>x===std[i]))return false;for(let g=0;g<N;g++)if(!regionConnected(regions,g))return false}
 if(type==='ineq')for(let p of constraints.pairs)if(p.v==='<'?!(sol[p.a]<sol[p.b]):!(sol[p.a]>sol[p.b]))return false;
 if(type==='consecutive'){let m=new Map(constraints.pairs.map(p=>[Math.min(p.a,p.b)+','+Math.max(p.a,p.b),p.mark]));for(let [a,b] of adjacentPairs()){let k=Math.min(a,b)+','+Math.max(a,b),truth=Math.abs(sol[a]-sol[b])===1;if(m.get(k)!==truth)return false}}
 return true}
function generatePuzzle(){N=+$('#size').value;type=$('#type').value;difficulty=+$('#difficulty').value;puzzleValid=false;killerPreverified=false;let attempts=0;while(attempts++<30){regions=standardRegions();constraints={pairs:[],cages:[]};givens=Array(N*N).fill(false);if(type==='killer'){loadKillerTemplate()}else{if(type==='jigsaw')loadJigsawTemplate();else sol=genStandardSolution();buildVariantConstraints();buildGivensUnique()}if(validatePuzzle()){puzzleValid=true;break}}if(!puzzleValid)throw new Error('無法生成有效唯一解題目');vals=sol.map((v,i)=>givens[i]?v:0);notes=Array.from({length:N*N},()=>new Set());selected=-1;noteMode=false;showWrong=false;history=[];elapsed=0;paused=false;startTimer();saveState();render()}
function borderStyle(i,d){let [r,c]=rc(i),s={},thick=type==='jigsaw'?'4.6px':'4px';s.borderRight='1px solid var(--thin)';s.borderBottom='1px solid var(--thin)';if(r===0||regions[idx(r-1,c)]!==regions[i])s.borderTop=thick+' solid #050505';if(c===0||regions[idx(r,c-1)]!==regions[i])s.borderLeft=thick+' solid #050505';if(c===N-1)s.borderRight=thick+' solid #050505';if(r===N-1)s.borderBottom=thick+' solid #050505';Object.assign(d.style,s)}
function conflictSet(){let bad=new Set();function dup(cells){let map=new Map();for(let i of cells)if(vals[i]){if(!map.has(vals[i]))map.set(vals[i],[]);map.get(vals[i]).push(i)}for(let a of map.values())if(a.length>1)a.forEach(i=>bad.add(i))}for(let r=0;r<N;r++){dup([...Array(N).keys()].map(c=>idx(r,c)));dup([...Array(N).keys()].map(c=>idx(c,r)))}for(let g=0;g<N;g++)dup([...Array(N*N).keys()].filter(i=>regions[i]===g));for(let p of constraints.pairs)if(vals[p.a]&&vals[p.b]){let ok=true;if(p.kind==='sum')ok=vals[p.a]+vals[p.b]===p.v;if(p.kind==='ineq')ok=p.v==='<'?vals[p.a]<vals[p.b]:vals[p.a]>vals[p.b];if(p.kind==='cons')ok=p.mark?Math.abs(vals[p.a]-vals[p.b])===1:Math.abs(vals[p.a]-vals[p.b])!==1;if(!ok){bad.add(p.a);bad.add(p.b)}}if(type==='killer'){for(let cage of constraints.cages){let seen=new Map(),sum=0,filled=0;for(let i of cage.cells)if(vals[i]){sum+=vals[i];filled++;if(!seen.has(vals[i]))seen.set(vals[i],[]);seen.get(vals[i]).push(i)}for(let a of seen.values())if(a.length>1)a.forEach(i=>bad.add(i));if(sum>cage.sum||(filled===cage.cells.length&&sum!==cage.sum))cage.cells.forEach(i=>bad.add(i))}}return bad}
function render(){const b=$('#board'),ov=$('#overlay');b.innerHTML='';ov.innerHTML='';b.style.gridTemplateColumns=`repeat(${N},1fr)`;b.style.gridTemplateRows=`repeat(${N},1fr)`;let bad=conflictSet(),selVal=selected>=0?vals[selected]:0;for(let i=0;i<N*N;i++){let d=document.createElement('div');d.className='cell '+(givens[i]?'given':'user');d.dataset.i=i;borderStyle(i,d);let [r,c]=rc(i);if(i===selected)d.classList.add('sel');else if(selVal&&vals[i]===selVal)d.classList.add('same');else if(selected>=0){let [sr,sc]=rc(selected);if(r===sr||c===sc||regions[i]===regions[selected])d.classList.add('peer')}if(bad.has(i))d.classList.add('conflict');if(showWrong&&!givens[i]&&vals[i]&&vals[i]!==sol[i])d.classList.add('wrong');if(vals[i])d.innerHTML=`<span class="v">${vals[i]}</span>`;else if(notes[i]&&notes[i].size){let h='<div class="notes">';for(let k=1;k<=9;k++)h+=`<span>${notes[i].has(k)?k:''}</span>`;d.innerHTML=h+'</div>'}d.addEventListener('click',()=>{if(!paused){selected=i;render()}});b.appendChild(d)}renderOverlay();renderPad();updateInfo();$('#pauseCover').classList.toggle('show',paused)}
function center(i){let [r,c]=rc(i);return{x:(c+.5)*100/N,y:(r+.5)*100/N}}
function renderOverlay(){let ov=$('#overlay'),cell=100/N;if(type==='sum'||type==='ineq'||type==='consecutive'){for(let p of constraints.pairs){if(type==='consecutive'&&!p.mark)continue;let A=center(p.a),B=center(p.b),x=(A.x+B.x)/2,y=(A.y+B.y)/2,stacked=Math.abs(A.x-B.x)<.01,e=document.createElement('div');if(type==='sum'){e.className='clue';e.textContent=p.v;e.style.left=x+'%';e.style.top=y+'%'}if(type==='consecutive'){e.className='consMark';e.style.left=x+'%';e.style.top=y+'%';e.style.width=stacked?'17px':'6px';e.style.height=stacked?'6px':'17px'}if(type==='ineq'){e.className='ineqMark';let av=sol[p.a],bv=sol[p.b];e.textContent=stacked?(av<bv?'⌃':'⌄'):(av<bv?'‹':'›');e.style.left=x+'%';e.style.top=y+'%'}ov.appendChild(e)}}if(type==='killer'){let ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 100 100');svg.setAttribute('width','100%');svg.setAttribute('height','100%');let inset=.72;for(let cage of constraints.cages){let set=new Set(cage.cells),first=[...cage.cells].sort((a,b)=>a-b)[0];for(let i of cage.cells){let [r,c]=rc(i),x=c*cell,y=r*cell,edges=[[r-1,c,x+inset,y+inset,x+cell-inset,y+inset],[r+1,c,x+inset,y+cell-inset,x+cell-inset,y+cell-inset],[r,c-1,x+inset,y+inset,x+inset,y+cell-inset],[r,c+1,x+cell-inset,y+inset,x+cell-inset,y+cell-inset]];for(let [rr,cc,x1,y1,x2,y2] of edges){if(rr<0||cc<0||rr>=N||cc>=N||!set.has(idx(rr,cc))){let l=document.createElementNS(ns,'line');l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x2);l.setAttribute('y2',y2);l.setAttribute('class','cageLine');svg.appendChild(l)}}}let [fr,fc]=rc(first),t=document.createElementNS(ns,'text');t.setAttribute('x',fc*cell+1.25);t.setAttribute('y',fr*cell+3.25);t.setAttribute('class','cageText');t.textContent=cage.sum;svg.appendChild(t)}ov.appendChild(svg)}}
function renderPad(){let p=$('#pad');p.innerHTML='';p.style.gridTemplateColumns=`repeat(${N},1fr)`;let selVal=selected>=0?vals[selected]:0;for(let n=1;n<=N;n++){let b=document.createElement('button');b.className='num';b.textContent=n;let count=vals.filter(v=>v===n).length;if(count>=N)b.classList.add('done');if(selVal===n)b.classList.add('selectedNum');b.addEventListener('click',()=>input(n));p.appendChild(b)}}
function updateInfo(){let stars='★'.repeat(difficulty),points=N===6?40:60,names={sum:'數和',consecutive:'連續',ineq:'數比',jigsaw:'鋸齒',killer:'殺手'};$('#meta').textContent=`${N}階${names[type]}・${points}分・${stars}`;let rules={sum:'線上提示數＝相鄰兩格之和；提示會涵蓋高、中、低不同總和，不只極端值。',consecutive:'標記的相鄰兩格必連續；所有相差 1 的相鄰格都會標記。',ineq:'相鄰兩格須符合藍色大小關係。',jigsaw:'每行、每列、每個黑色粗線不規則區域皆不重複；區域邊界已強化顯示。',killer:'沒有預填大數字；每個虛線算組內數字不可重複，且總和＝提示。'};$('#ruleText').textContent=rules[type]+` 難度 ${stars}（訓練器估算）`;$('#validBadge').textContent=puzzleValid?'唯一解 ✓':'驗證中'}
function snapshot(i){history.push({i,val:vals[i],notes:[...notes[i]]});if(history.length>100)history.shift()}
function standardPeers(i){let [r,c]=rc(i),s=new Set();for(let k=0;k<N;k++){s.add(idx(r,k));s.add(idx(k,c))}for(let k=0;k<N*N;k++)if(regions[k]===regions[i])s.add(k);s.delete(i);return s}
function input(n){if(selected<0||givens[selected]||paused)return;snapshot(selected);showWrong=false;if(noteMode){vals[selected]=0;notes[selected].has(n)?notes[selected].delete(n):notes[selected].add(n)}else{vals[selected]=n;notes[selected].clear();for(let p of standardPeers(selected))notes[p]?.delete(n)}saveState();render();checkFinish()}
function erase(){if(selected<0||givens[selected]||paused)return;snapshot(selected);vals[selected]=0;notes[selected].clear();showWrong=false;saveState();render()}
function undo(){if(!history.length){toast('沒有可復原的步驟');return}let h=history.pop();selected=h.i;vals[h.i]=h.val;notes[h.i]=new Set(h.notes);showWrong=false;saveState();render()}
function checkNow(){if(paused)return;showWrong=true;render();let wrong=vals.reduce((n,v,i)=>n+(!givens[i]&&v&&v!==sol[i]?1:0),0);if(!wrong)toast(vals.includes(0)?'目前已填的都正確':'全部正確！');else toast(`有 ${wrong} 格需要再檢查`)}
function checkFinish(){if(vals.some(v=>!v))return;if(vals.every((v,i)=>v===sol[i])){pauseTimerOnly();toast('完成！ '+$('#timer').textContent);setTimeout(()=>alert('完成！\n時間：'+$('#timer').textContent+'\n難度：'+'★'.repeat(difficulty)),250)}else toast('已填滿，但還有錯誤')}
function startTimer(){clearInterval(tick);started=Date.now();paused=false;tick=setInterval(drawTime,250);drawTime()}
function pauseTimerOnly(){if(!paused){elapsed+=Date.now()-started;paused=true}clearInterval(tick);drawTime()}
function togglePause(){if(paused){paused=false;started=Date.now();tick=setInterval(drawTime,250);$('#pauseBtn').textContent='暫停';toast('繼續計時')}else{elapsed+=Date.now()-started;paused=true;clearInterval(tick);$('#pauseBtn').textContent='繼續'}saveState();render();drawTime()}
function drawTime(){let ms=elapsed+(paused?0:Date.now()-started),s=Math.floor(ms/1000);$('#timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function hasProgress(){return vals.some((v,i)=>!givens[i]&&v)||notes.some(s=>s.size)}
function setControls(){ $('#type').value=type;$('#size').value=String(N);$('#difficulty').value=String(difficulty)}
function requestNew(fromControl=false){if(hasProgress()&&!confirm('目前題目還沒完成，要放棄並產生新題嗎？')){setControls();return}let cover=$('#loadingCover');cover.classList.add('show');requestAnimationFrame(()=>setTimeout(()=>{try{puzzleValid=false;generatePuzzle();toast(type==='killer'?'新題完成・殺手無預填數字':'新題已完成唯一解驗證')}catch(e){console.error(e);alert('出題時發生錯誤，請再按一次「新題」。')}finally{cover.classList.remove('show')}},20))}
function reveal(){if(paused)return;if(!confirm('確定要顯示完整答案嗎？這題會停止計時。'))return;for(let i=0;i<N*N;i++)vals[i]=sol[i];notes.forEach(s=>s.clear());pauseTimerOnly();saveState();render();toast('已顯示答案')}
function saveState(){try{let em=elapsed+(paused?0:Date.now()-started);localStorage.setItem(STORAGE,JSON.stringify({version:4,N,type,difficulty,sol,regions,constraints,givens,vals,notes:notes.map(s=>[...s]),selected,noteMode,showWrong,paused,elapsed:em,puzzleValid,killerPreverified}))}catch(e){}}
function restoreState(){try{let raw=localStorage.getItem(STORAGE);if(!raw)return false;let s=JSON.parse(raw);if(s.version!==4||![6,9].includes(s.N)||!s.sol||s.sol.length!==s.N*s.N)return false;N=s.N;type=s.type;difficulty=s.difficulty;sol=s.sol;regions=s.regions;constraints=s.constraints;givens=s.givens;vals=s.vals;notes=s.notes.map(a=>new Set(a));selected=s.selected??-1;noteMode=!!s.noteMode;showWrong=!!s.showWrong;paused=!!s.paused;elapsed=s.elapsed||0;killerPreverified=!!s.killerPreverified;puzzleValid=validatePuzzle();if(!puzzleValid)return false;setControls();$('#noteBtn').classList.toggle('on',noteMode);$('#pauseBtn').textContent=paused?'繼續':'暫停';if(!paused){started=Date.now();tick=setInterval(drawTime,250)}drawTime();render();return true}catch(e){console.warn(e);return false}}
$('#newBtn').addEventListener('click',()=>requestNew(false));['#type','#size','#difficulty'].forEach(s=>$(s).addEventListener('change',()=>requestNew(true)));
$('#noteBtn').addEventListener('click',()=>{noteMode=!noteMode;$('#noteBtn').classList.toggle('on',noteMode);saveState();toast(noteMode?'筆記模式':'輸入模式')});$('#undoBtn').addEventListener('click',undo);$('#eraseBtn').addEventListener('click',erase);$('#checkBtn').addEventListener('click',checkNow);$('#pauseBtn').addEventListener('click',togglePause);$('#solveBtn').addEventListener('click',reveal);
// iPhone/iPad: lock the page itself. Taps still work, but drag/pinch/double-tap cannot move or zoom the webpage.
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});document.addEventListener('gestureend',e=>e.preventDefault(),{passive:false});window.addEventListener('scroll',()=>window.scrollTo(0,0),{passive:true});
window.addEventListener('pagehide',saveState);setInterval(saveState,5000);
if(!restoreState())requestNew(false);else toast('已恢復上次進度');
